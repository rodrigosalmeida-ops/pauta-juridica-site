<title>Pauta Jurídica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Conceito: mesa de controle do escritório. Coluna escura fixa, contagem D-n em mono e carimbo de conferência. */
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#141C2B;--muted:#566275;--line:#D6DCE5;
  --accent:#2F45C5;--accent-soft:#E3E7FB;--on-accent:#FFFFFF;
  --side:#121A2C;--side-ink:#DDE3F0;--side-muted:#95A1BA;--side-line:#29344B;
  --crit:#B3261E;--crit-soft:#FBE6E4;--warn:#855600;--warn-soft:#FBEFD2;--ok:#1C6B46;--ok-soft:#DFF2E7;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1420;--surface:#182031;--surface-2:#1E273A;--ink:#E8ECF4;--muted:#A0ABBE;--line:#2C374C;
  --accent:#9BAAFF;--accent-soft:#252E57;--on-accent:#0F1420;
  --side:#0A0E18;--side-ink:#DDE3F0;--side-muted:#8E9AB3;--side-line:#232C40;
  --crit:#FF9A90;--crit-soft:#3D1C1C;--warn:#F0C063;--warn-soft:#3A2C10;--ok:#74D8A4;--ok-soft:#15352A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1420;--surface:#182031;--surface-2:#1E273A;--ink:#E8ECF4;--muted:#A0ABBE;--line:#2C374C;
  --accent:#9BAAFF;--accent-soft:#252E57;--on-accent:#0F1420;
  --side:#0A0E18;--side-ink:#DDE3F0;--side-muted:#8E9AB3;--side-line:#232C40;
  --crit:#FF9A90;--crit-soft:#3D1C1C;--warn:#F0C063;--warn-soft:#3A2C10;--ok:#74D8A4;--ok-soft:#15352A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{padding:0 10px}
.brand b{font:700 19px/1.1 var(--display);display:block}
.brand span{font-size:12px;color:var(--side-muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;color:var(--side-ink);text-decoration:none;border-radius:4px;white-space:nowrap}
nav a:hover{background:var(--side-line)}
nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
nav a i{font:600 11.5px var(--mono);background:var(--crit);color:#fff;padding:0 6px;border-radius:9px}
.who{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-line);display:grid;gap:4px}
.who label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--side-muted)}
.who select{background:var(--side-line);border:0;color:var(--side-ink);padding:6px;border-radius:4px;width:100%}
main{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.head h1{font-size:26px;line-height:1.15}
.head p{margin:2px 0 0;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 0;text-decoration:underline}
.btn[disabled]{opacity:.55;cursor:default}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);padding:10px 12px;border-radius:4px;margin-bottom:14px}
.notice.warn{background:var(--warn-soft)}
/* faixa de contagem */
.ledger{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:18px}
.ledger a{padding:12px 14px;text-decoration:none;color:inherit;border-left:1px solid var(--line);min-width:0}
.ledger a:first-child{border-left:0}
.ledger a:hover{background:var(--surface-2)}
.ledger b{display:block;font:600 28px/1.1 var(--mono)}
.ledger span{font-size:12.5px;color:var(--muted)}
.ledger .c b{color:var(--crit)}.ledger .w b{color:var(--warn)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
.sec{display:grid;gap:18px;min-width:0}
.panel h2{font-size:16px;margin-bottom:8px}
.empty{background:var(--surface);border:1px dashed var(--line);padding:22px 18px;border-radius:4px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.empty .btns{margin-top:12px}
/* linhas de prazo */
.rows{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,2.2fr) minmax(0,1.3fr) 104px 104px;gap:12px;align-items:center;background:var(--surface);padding:9px 12px;cursor:pointer;text-align:left;border:0;width:100%}
.row:hover{background:var(--surface-2)}
.rows.compact .row{grid-template-columns:64px minmax(0,1fr) auto}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .t span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lbl{display:none;font-size:11px;color:var(--muted)}
.d{font:600 13px var(--mono);padding:3px 0;text-align:center;border-radius:3px;display:inline-block;min-width:52px}
.d.vencido,.d.hoje,.d.critico{background:var(--crit-soft);color:var(--crit)}
.d.vencido{background:var(--crit);color:var(--surface)}
.d.atencao{background:var(--warn-soft);color:var(--warn)}
.d.ok{background:var(--ok-soft);color:var(--ok)}
.d.done,.d.semdata{background:var(--surface-2);color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.stamp{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ok);border:1.5px double var(--ok);padding:0 4px;transform:rotate(-2deg)}
.stamp.no{color:var(--warn);border-color:var(--warn)}
.bars{display:grid;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px}
.bar{display:grid;grid-template-columns:minmax(84px,132px) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--surface-2);border-radius:0 4px 4px 0}
.bar .fl{height:10px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar .v{text-align:right;font-family:var(--mono)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
.toolbar input{flex:1 1 200px}
/* quadro */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:240px;display:grid;gap:8px;align-content:start}
.col.over{outline:2px solid var(--accent)}
.col h3{font-size:13.5px;display:flex;justify-content:space-between;gap:6px;padding:2px 2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 10px;display:grid;gap:5px;cursor:grab;text-align:left;width:100%;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:6px;align-items:start}
.card b{font-weight:600;overflow-wrap:anywhere}
.card .n{font:400 11.5px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.card .ft{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.cal .wd{background:var(--surface-2);text-align:center;font-size:11.5px;padding:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day{background:var(--surface);min-height:92px;padding:4px;display:grid;gap:2px;align-content:start;border:0;text-align:left;cursor:pointer;min-width:0}
.day.fora{background:var(--surface-2);color:var(--muted)}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day .num{font:500 12px var(--mono)}
.day.hoje .num{background:var(--accent);color:var(--on-accent);padding:0 4px;border-radius:3px;justify-self:start}
.ev{font-size:11.5px;padding:0 4px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2)}
.ev.fatal{background:var(--crit-soft);color:var(--crit)}
.ev.interno{background:var(--warn-soft);color:var(--warn)}
.ev.comp{background:var(--accent-soft);color:var(--accent)}
.pub{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:8px}
.pub pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 13px/1.45 var(--body);max-height:96px;overflow:auto;color:var(--muted)}
.extr{background:var(--surface-2);padding:8px 10px;border-radius:4px;display:grid;gap:2px}
textarea,.fld input,.fld select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 8px}
textarea{min-height:92px;resize:vertical}
.list{display:grid;gap:12px}
/* janelas */
.overlay{position:fixed;inset:0;background:rgba(9,13,24,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.overlay.right{justify-content:flex-end;padding:0;align-items:stretch}
.sheet{background:var(--surface);border-radius:6px;width:min(640px,100%);padding:18px;display:grid;gap:12px;align-self:flex-start}
.overlay.right .sheet{width:min(500px,100%);border-radius:0;align-self:stretch;align-content:start;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:19px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:3px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label,.k{font-size:12px;color:var(--muted)}
.fld small{font-size:12px;color:var(--muted)}
.fld small.err{color:var(--crit)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.kv>div{min-width:0;overflow-wrap:anywhere}
.law{font-size:12.5px;background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:4px}
.check{display:flex;gap:8px;align-items:center;padding:3px 0}
.hist{display:grid;gap:6px;border-left:2px solid var(--line);padding-left:10px;font-size:13px}
.hist time{display:block;font:400 11.5px var(--mono);color:var(--muted)}
.closex{justify-self:end;border:0;background:none;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:4px;z-index:40;max-width:min(520px,92vw)}
.out{white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:4px;overflow-wrap:anywhere}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:60px minmax(0,1fr) 100px}.row .hide-m{display:none}}
@media (max-width:760px){
  .app{display:block}
  .side{position:static;height:auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .brand{padding:0}
  nav{flex-direction:row;overflow-x:auto;margin-inline:-4px;padding-bottom:2px}
  .who{margin:0;padding:0;border:0;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}
  main{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head h1{font-size:22px}
  .rows.compact .row{grid-template-columns:60px minmax(0,1fr)}
  .rows.compact .row>:nth-child(3):not(:empty){grid-column:2}
  .ledger{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ledger a{border-left:0;border-top:1px solid var(--line)}
  .ledger a:nth-child(-n+2){border-top:0}
  .ledger a:nth-child(even){border-left:1px solid var(--line)}
  .ledger a:last-child{grid-column:1/-1;border-left:0}
  .board{grid-auto-columns:minmax(232px,82%)}
  .day{min-height:58px}
  .ev{font-size:0;height:5px;padding:0}
  .grid2,.kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .14s ease-out}@keyframes up{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><b>Pauta Jurídica</b><span id="sync">Conectando…</span></div>
    <nav id="nav" aria-label="Seções"></nav>
    <div class="who"><label for="eu">Estou usando como</label><select id="eu"></select></div>
  </aside>
  <main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

<script>
'use strict';
/* ---------- regras (funções puras) ---------- */
const ETAPAS=[['triagem','Triagem'],['fazer','A fazer'],['elaboracao','Em elaboração'],['revisao','Em revisão'],['ajustes','Ajustes'],['pronta','Pronta para protocolo'],['protocolada','Protocolada']];
const NOME_ETAPA=Object.fromEntries(ETAPAS);
const TIPOS_PADRAO=['Contestação','Réplica','Petição inicial','Manifestação','Embargos de declaração','Apelação','Agravo','Recurso ordinário','Recurso especial','Contrarrazões','Memoriais','Impugnação','Cálculos','Outra'];
const CHECK_PADRAO=['Ler a decisão ou publicação','Reunir documentos','Pesquisar jurisprudência','Escrever a minuta','Revisar','Conferir anexos e assinatura'];
const TIPOS_COMP=['Audiência','Perícia','Reunião','Diligência','Sustentação oral','Outro'];
function iso(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function hoje(){return iso(new Date())}
function utc(s){const[a,m,d]=s.split('-').map(Number);return Date.UTC(a,m-1,d)}
function diasEntre(a,b){return Math.round((utc(b)-utc(a))/864e5)}
function somaDias(s,n){const[a,m,d]=s.split('-').map(Number);return iso(new Date(a,m-1,d+n))}
function prazoInterno(fatal,margem){
  if(!fatal)return '';
  let r=somaDias(fatal,-Math.max(0,margem));
  const[a,m,d]=r.split('-').map(Number);const w=new Date(a,m-1,d).getDay();
  if(w===6)r=somaDias(r,-1);if(w===0)r=somaDias(r,-2);
  return r;
}
function situacao(d,ref){
  if(d.etapa==='protocolada')return{cod:'done',rot:'OK',txt:'Protocolada'};
  if(!d.prazoFatal)return{cod:'semdata',rot:'s/ data',txt:'Sem prazo'};
  const x=diasEntre(ref,d.prazoFatal);
  if(x<0)return{cod:'vencido',rot:'D+'+(-x),txt:'Vencido há '+(-x)+(x===-1?' dia':' dias')};
  if(x===0)return{cod:'hoje',rot:'D0',txt:'Vence hoje'};
  const txt='Faltam '+x+(x===1?' dia':' dias');
  if(x<=2)return{cod:'critico',rot:'D-'+x,txt};
  if(x<=5)return{cod:'atencao',rot:'D-'+x,txt};
  return{cod:'ok',rot:'D-'+x,txt};
}
function validaCNJ(v){
  const n=String(v||'').replace(/\D/g,'');
  if(n.length!==20)return null;
  const dv=n.slice(7,9),base=n.slice(0,7)+n.slice(9)+'00';
  const calc=String(98n-(BigInt(base)%97n)).padStart(2,'0');
  return dv===calc;
}
function formataCNJ(v){const n=String(v||'').replace(/\D/g,'');return n.length===20?n.replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/,'$1-$2.$3.$4.$5.$6'):String(v||'').trim()}
function tempoPorEtapa(lista){
  const soma={},qtd={};
  for(const d of lista){
    let ini=d.criadoEm,etapa='triagem';
    if(!(d.historico||[]).length){}
    for(const h of d.historico||[]){
      if(h.t!=='etapa')continue;
      if(h.de)etapa=h.de;
      const x=(new Date(h.em)-new Date(ini))/864e5;
      if(x>=0){soma[etapa]=(soma[etapa]||0)+x;qtd[etapa]=(qtd[etapa]||0)+1}
      ini=h.em;etapa=h.para;
    }
  }
  return Object.fromEntries(Object.keys(soma).map(k=>[k,soma[k]/qtd[k]]));
}
function csv(linhas){return '\ufeff'+linhas.map(l=>l.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n')}
function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');
  const prim=txt.split(/\r?\n/)[0]||'',sep=(prim.match(/;/g)||[]).length>=(prim.match(/,/g)||[]).length?';':',';
  const out=[];let r=[],c='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){r.push(c);c=''}
    else if(ch==='\n'){r.push(c.replace(/\r$/,''));out.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c.replace(/\r$/,''));out.push(r)}
  return out;
}
function lerData(s){
  s=String(s||'').trim();if(!s)return '';
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/),a,me,d;
  if(m){d=+m[1];me=+m[2];a=+m[3]}else{m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;a=+m[1];me=+m[2];d=+m[3]}
  const x=new Date(a,me-1,d);
  return x.getMonth()===me-1&&x.getDate()===d?iso(x):null;
}
function analisaPlanilha(txt){
  const l=parseCSV(txt).filter(r=>r.some(c=>String(c).trim()));
  if(l.length<2)return{ok:[],erros:['A planilha não tem linhas de dados.']};
  const nor=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  const h=l[0].map(nor),col=(...n)=>h.findIndex(x=>n.includes(x));

async function moverEtapa(id,para,extra){
  const d=S.demandas[id];if(!d||d.etapa===para)return;
  if(para==='pronta'&&!d.revisor&&!(extra&&extra.revisor)){
    janela(`<h2>Quem revisou esta peça?</h2><form data-f="revisor" data-id="${id}" class="fld"><label for="rv">Revisor</label>${S.cfg.equipe.length?`<select id="rv" required>${opts(S.cfg.equipe,'','Escolha')}</select>`:'<input id="rv" required maxlength="60">'}<div class="btns" style="margin-top:8px"><button class="btn pri">Confirmar</button><button type="button" class="btn" data-a="fechar">Cancelar</button></div></form>`);return}
  if(para==='protocolada'&&!(extra&&extra.protocoloData)){
    janela(`<h2>Registrar protocolo</h2>${d.conferidoPor?'':'<p class="law" style="margin:0">Este prazo ainda não foi conferido por uma segunda pessoa.</p>'}<form data-f="protocolo" data-id="${id}" class="grid2"><div class="fld"><label for="pt-d">Data do protocolo</label><input id="pt-d" type="date" required value="${hoje()}"></div><div class="fld"><label for="pt-n">Número do recibo</label><input id="pt-n" maxlength="60" required></div><div class="btns fld w" style="display:flex"><button class="btn pri">Confirmar protocolo</button><button type="button" class="btn" data-a="fechar">Cancelar</button></div></form>`);return}
  const em=new Date().toISOString();
  const up={...(extra||{}),etapa:para,etapaDesde:em};
  if(d.etapa==='protocolada'){up.protocoloData='';up.protocoloNumero=''}
  await comHist(id,[{t:'etapa',de:d.etapa,para,quem:ator(),em}],up);
  toast('Peça movida para '+NOME_ETAPA[para]+'.');
}

    const v=i=>$(i).value.trim(),id=f.dataset.id,antes=id?S.demandas[id]:null,em=new Date().toISOString();
    const fatal=v('#d-fatal'),dados={cliente:v('#d-cli'),processo:formataCNJ(v('#d-proc')),tipoPeca:v('#d-tipo'),prioridade:v('#d-prio'),dataPublicacao:v('#d-pub'),prazoFatal:fatal,prazoInterno:v('#d-int'),responsavel:v('#d-resp'),revisor:v('#d-rev'),obs:v('#d-obs')};
    if(fatal&&dados.prazoInterno&&dados.prazoInterno>fatal){toast('O prazo interno não pode ser depois do prazo fatal.');return}
    const btn=f.querySelector('.btn.pri');
    if(antes){
      const hs=[];
      if(fatal!==(antes.prazoFatal||'')){dados.conferidoPor='';dados.conferidoEm='';dados.registradoPor=ator();dados.registradoId=S.me&&S.me.id||'';hs.push({t:'nota',txt:'Prazo fatal alterado de '+dataBR(antes.prazoFatal)+' para '+dataBR(fatal)+'. Conferência zerada.',quem:ator(),em})}
      if(dados.prazoInterno!==(antes.prazoInterno||''))hs.push({t:'nota',txt:'Prazo interno alterado para '+dataBR(dados.prazoInterno),quem:ator(),em});
      if(dados.responsavel!==(antes.responsavel||''))hs.push({t:'nota',txt:'Responsável: '+(dados.responsavel||'nenhum'),quem:ator(),em});
      if(dados.processo!==(antes.processo||''))hs.push({t:'nota',txt:'Número do processo alterado',quem:ator(),em});
      btn.disabled=true;
      try{await comHist(id,hs,dados);S.aberta=id;desenhaGaveta();toast('Demanda atualizada.')}catch(e){btn.disabled=false}
    }else{
      const num=soNum(dados.processo),dup=num.length>=10&&lista().find(d=>soNum(d.processo)===num&&d.tipoPeca===dados.tipoPeca&&d.prazoFatal===fatal);
      if(dup&&f.dataset.dup!=='1'){f.dataset.dup='1';toast('Já existe esta peça com o mesmo prazo neste processo. Clique em Salvar de novo para criar mesmo assim.');return}
      btn.disabled=true;
      const nid=novoId('demandas');
      try{await gravar('demandas',nid,{...dados,etapa:'triagem',etapaDesde:em,criadoEm:em,registradoPor:ator(),registradoId:S.me&&S.me.id||'',conferidoPor:'',excluida:false,checklist:(S.cfg.checklist||[]).map(t=>({t,ok:false})),historico:[{t:'nota',txt:'Demanda criada',quem:ator(),em}]})}catch(e){btn.disabled=false;return}
      if(f.dataset.pub)await alterar('publicacoes',f.dataset.pub,{status:'demanda',demandaId:nid,tratadaPor:ator()});
      fechar();toast('Demanda criada.');
    }
  },
  async revisor(f){const id=f.dataset.id,r=$('#rv').value;fechar();await moverEtapa(id,'pronta',{revisor:r})},
  async protocolo(f){const id=f.dataset.id,x={protocoloData:$('#pt-d').value,protocoloNumero:$('#pt-n').value.trim()};fechar();await moverEtapa(id,'protocolada',x)},
  async comp(f){const v=i=>$(i).value.trim(),id=f.dataset.id||novoId('compromissos');await gravar('compromissos',id,{titulo:v('#c-tit'),tipo:v('#c-tipo'),responsavel:v('#c-resp'),data:v('#c-data'),hora:v('#c-hora'),local:v('#c-loc'),processo:formataCNJ(v('#c-proc'))});fechar();toast('Compromisso salvo.')},
  async nota(){const i=$('#dr-nota'),t=i.value.trim();if(!t)return;const d=S.demandas[S.aberta];i.value='';await comHist(d.id,[{t:'nota',txt:t,quem:ator(),em:new Date().toISOString()}]);i.blur();desenhaGaveta()},
  async addCk(){const i=$('#dr-ck'),t=i.value.trim();if(!t)return;const d=S.demandas[S.aberta];i.value='';await alterar('demandas',d.id,{checklist:[...(d.checklist||[]),{t,ok:false}]});i.blur();desenhaGaveta()},
  async addEq(){const i=$('#eq-nome'),n=i.value.trim();if(!n||S.cfg.equipe.includes(n))return;await salvarCfg({equipe:[...S.cfg.equipe,n]})},
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(el.dataset.a==='fundo'){if(ev.target===el)fechar();return}if(fn)fn(el,ev)});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;if(F[f.dataset.f])F[f.dataset.f](f)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#root').firstChild)fechar()});
document.addEventListener('input',ev=>{
  const k=ev.target.dataset.i;
  if(k==='q'){S.f.q=ev.target.value;render()}else if(k==='kq'){S.kq=ev.target.value;render()}
  if(ev.target.id==='d-fatal'){
    const i=$('#d-int'),val=ev.target.value,m=$('#d-fatal-m');if(i)i.value=prazoInterno(val,margem());
    if(m){let t='';if(val){const[a,me,d]=val.split('-').map(Number),w=new Date(a,me-1,d).getDay();if(w===0||w===6)t='Esta data cai em fim de semana. Confira.';else if(val<hoje())t='Esta data já passou.'}m.textContent=t}
  }
  if(ev.target.id==='d-proc'){const m=$('#d-proc-m'),r=validaCNJ(ev.target.value);m.textContent=r===false?'Dígito verificador não confere. Revise o número.':'';m.className=r===false?'err':''}
});
document.addEventListener('change',ev=>{
  const t=ev.target,c=t.dataset.c;
  if(t.id==='eu'){S.eu=t.value;try{localStorage.setItem('pauta_eu',S.eu)}catch(e){}return}
  if(c==='resp'){S.f.resp=t.value;render()}else if(c==='sit'){S.f.sit=t.value;render()}else if(c==='kresp'){S.kresp=t.value;render()}
  else if(c==='fetapa'){S.f.etapa=t.value;render()}else if(c==='fprio'){S.f.prio=t.value;render()}
  else if(c==='periodo'){S.periodo=Number(t.value);render()}
  else if(c==='margem'){salvarCfg({margemDias:Math.min(30,Math.max(0,Number(t.value)||0))})}
  else if(c==='meta'){salvarCfg({metaSemanal:Math.max(0,Number(t.value)||0)})}
  else if(c==='lim'){salvarCfg({limites:{...S.cfg.limites,[t.dataset.e]:Math.max(0,Number(t.value)||0)}})}
  else if(c==='wip'){salvarCfg({wip:{...S.cfg.wip,[t.dataset.e]:Math.max(0,Number(t.value)||0)}})}
  else if(c==='drResp'||c==='drRev'){const k=c==='drResp'?'responsavel':'revisor';comHist(S.aberta,[{t:'nota',txt:(c==='drResp'?'Responsável: ':'Revisor: ')+(t.value||'nenhum'),quem:ator(),em:new Date().toISOString()}],{[k]:t.value})}
  else if(c==='pdp'){const p=t.value;saidaClaude=textoPauta(p?abertas().filter(d=>d.responsavel===p):abertas(),hoje(),p?'Pauta de '+p:'Pauta do escritório');$('#dr-out').textContent=saidaClaude}
  else if(c==='imp'&&t.files[0]){t.files[0].text().then(x=>{const r=analisaPlanilha(x);S.importe=r.ok;t.value='';
    janela(`<h2>Importar planilha</h2><p style="margin:0">${r.ok.length} ${r.ok.length===1?'linha pronta':'linhas prontas'} para importar${r.erros.length?' e '+r.erros.length+' com problema':''}.</p>${r.erros.length?`<div class="law">${r.erros.slice(0,12).map(esc).join('<br>')}${r.erros.length>12?'<br>…':''}</div>`:''}<p class="small muted" style="margin:0">Linhas com problema ficam de fora. Todas entram em Triagem, com o prazo a conferir.</p><div class="btns">${r.ok.length?`<button class="btn pri" data-a="confirmaImp">Importar</button>`:''}<button class="btn" data-a="fechar">Cancelar</button></div>`)})}
  else if(c==='res'&&t.files[0]){t.files[0].text().then(x=>{t.value='';let b=null;try{b=JSON.parse(x)}catch(e){}
    if(!b||b.app!=='pauta-juridica'||![b.demandas,b.compromissos,b.publicacoes].every(Array.isArray)){toast('Este arquivo não é uma cópia da Pauta Jurídica.');return}
    S.restaura=b;janela(`<h2>Restaurar cópia de ${dataHoraBR(b.geradoEm)}?</h2><p style="margin:0">${b.demandas.length} demandas, ${b.compromissos.length} compromissos e ${b.publicacoes.length} publicações. Registros iguais voltam à versão da cópia. Registros novos continuam aqui.</p><div class="btns"><button class="btn danger" data-a="confirmaRes">Restaurar</button><button class="btn" data-a="fechar">Cancelar</button></div>`)})}
  else if(c==='etapa'){moverEtapa(S.aberta,t.value)}
  else if(c==='ck'){const d=S.demandas[S.aberta],ck=(d.checklist||[]).map((x,i)=>i===Number(t.dataset.i2)?{...x,ok:t.checked}:x);alterar('demandas',d.id,{checklist:ck})}
});
/* arrastar */
let arrastando=null;
document.addEventListener('dragstart',ev=>{const c=ev.target.closest&&ev.target.closest('[data-drag]');if(c){arrastando=c.dataset.drag;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',arrastando)}});
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('[data-col]');if(c&&arrastando){ev.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('[data-col]');if(c&&arrastando){ev.preventDefault();c.classList.remove('over');moverEtapa(arrastando,c.dataset.col);arrastando=null}});
document.addEventListener('dragend',()=>{arrastando=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
/* rotas */
function rota(){const h=location.hash.slice(1);S.view=V[h]?h:'painel';if(S.aberta||$('#root').firstChild)fechar();render();window.scrollTo(0,0)}
addEventListener('hashchange',rota);
/* conexão */
function snap(c){return s=>{S[c]=Object.fromEntries(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));if(!s.metadata.fromCache){clearTimeout(snap.t);sync('Salvo e sincronizado')}render()}}
function falha(e){clearTimeout(snap.t);sync('Sem sincronização');toast('A sincronização parou. Recarregue a página.')}
async function iniciar(){
  rota();
  if(!window.claude||!claude.use){S.conectado=true;sync('Sem banco: nada é salvo');abreDb();render();return}
  claude.use('sample').then(s=>{sample=s;if(s)render()});
  claude.use('downloads').then(d=>{downloads=d;if(d)render()});
  claude.use('user').then(async u=>{
    if(!u)return;
    if(await u.can('data.write')===false){S.leitura=true;render()}
    const me=await u.me();S.me={id:me.id,name:me.name};
    if(!S.eu&&me.name&&S.cfg.equipe.includes(me.name)){S.eu=me.name;render()}
  });
  db=await claude.use('db');
  S.conectado=true;abreDb();
  if(!db){sync('Sem banco: nada é salvo');render();return}
  snap.t=setTimeout(()=>sync('Ainda sem resposta do banco'),10000);
  for(const c of ['demandas','compromissos','publicacoes'])db.collection(c).onSnapshot(snap(c),falha);
  ouveCaptura();
  db.doc('config/geral').onSnapshot(s=>{if(s.exists){const x=s.data();S.cfg={...CFG_PADRAO,...x,tipos:x.tipos&&x.tipos.length?x.tipos:TIPOS_PADRAO};if(!S.eu&&S.me&&S.me.name&&S.cfg.equipe.includes(S.me.name))S.eu=S.me.name;render()}},falha);
}
/* robô */
function ouveCaptura(){db.doc('config/captura').onSnapshot(s=>{if(s.exists){S.captura={dados:s.data()};render()}},()=>{})}
/* a virada do dia atualiza os contadores de quem deixa a página aberta */
let diaAtual=hoje();setInterval(()=>{if(hoje()!==diaAtual){diaAtual=hoje();render()}},60000);
iniciar();
window.__iniciaLogin();
</script>

</body></html>
